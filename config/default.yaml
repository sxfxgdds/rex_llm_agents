num_agents: 10
num_rounds: 300
game: prisoner_dilemma
backend:
  type: mock
  model: gpt-4o-mini
  api_key_env: OPENAI_API_BASE
  base_url: https://api.openai.com/v1
  max_retries: 2
  timeout: 30.0
seed: 42
seeds: [42, 123, 456, 789, 1011, 1213, 1415, 1617, 1819, 2021,
        2223, 2425, 2627, 2829, 3031, 3233, 3435, 3637, 3839, 4041,
        4243, 4445, 4647, 4849, 5051, 5253, 5455, 5657, 5859, 6061]
initial_reputation: 0.5
exploration:
  mode: piecewise
  fixed_temperature: 0.5
  t_min: 0.2
  t_max: 0.8
reputation:
  alpha: 0.8
  defect_penalty_scale: 1.5
  cooperate_recovery_scale: 0.7
malicious:
  fraction: 0.0
  warmup_rounds: 20
  exploit_threshold: 0.7
attack:
  enabled: false
  attack_round: 150
  target_fraction: 0.2
  reputation_drop: 0.5
output_dir: outputs/results
